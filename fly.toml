# fly.toml app configuration file generated for aqelfirst on 2026-09-06T19:19:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aqelfirst'
primary_region = 'iad'
console_command = 'python3 bot.py'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
